<nav class="landing-navbar mat-elevation-z4">
  <div class="navbar-container">

    <!-- Brand -->
    <a class="brand" routerLink="/">

      <img src="logo-textonly-light.png" alt="AuraFit Logo" class="aurafit-logo" />

    </a>

    <!-- Hamburger Icon -->
    <button mat-icon-button class="mobile-menu-button" (click)="toggleMobileMenu()">

    <div class="nav-group" [class.open]="isMobileMenuOpen">

        <li><a routerLink="/about" (click)="closeMenu()">About Us</a></li>

      </ul>
      <div class="auth-buttons">
